name: Deploy community atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check application syntax
        run: node --check dist/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for uploaded artifact visibility
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, time, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?name=github-pages"
          for attempt in range(12):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  artifacts = json.load(response).get("artifacts", [])
              if any(a["name"] == "github-pages" and not a["expired"] for a in artifacts):
                  print("Pages artifact is ready.")
                  break
              if attempt == 11:
                  raise SystemExit("Pages artifact is not visible yet; retry this deployment.")
              time.sleep(5)
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
