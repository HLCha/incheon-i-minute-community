<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인천 i Minute City 커뮤니티 탐색</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css?v=7"></head><body>
<div id="map" aria-label="인천 커뮤니티 지도"></div>
<header><h1>인천 <span class="title-en">i Minute City</span> 커뮤니티 탐색</h1></header>
<aside class="controls glass" aria-label="지도 탐색 메뉴">
 <section class="menu-section"><h2 class="menu-heading"><span class="menu-icon" aria-hidden="true">◎</span>분석 범위</h2>
  <div class="seg" id="scenarios"><button class="scope-button active" data-s="Walk15"><svg viewBox="0 0 64 66" aria-hidden="true" fill="currentColor"><circle cx="37" cy="9" r="6"/><path d="M28 18Q31 15 35 18L42 24 37 38 26 34 24 25Z"/><path d="m28 23-9 7-4 12m19-18 8 10 9 4M29 36l-5 12-11 13m20-25 8 12 5 13" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>도보 15분</span></button><button class="scope-button " data-s="Dist1200m"><svg viewBox="0 0 64 66" aria-hidden="true" fill="currentColor"><g fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="47" r="10.5"/><circle cx="51" cy="47" r="10.5"/><path d="m13 47 11-19 14 19H13l13-15m18-8h5l2 23M21 28h7"/></g><circle cx="36" cy="9" r="5.5"/><path d="m30 20-9 11 13 9-1 13m-2-32 10 10 7 1" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>1,200m</span></button><button class="scope-button " data-s="Dist4800m"><svg viewBox="0 0 64 66" aria-hidden="true" fill="currentColor"><path fill-rule="evenodd" d="M14 14Q17 7 24 7h16q8 0 11 8l5 14q5 3 5 10v15q0 5-5 5h-3q-5 0-5-5v-3H16v3q0 5-5 5H8q-5 0-5-5V39q0-7 5-10Zm7 0q-2 0-3 3l-4 12h36l-4-12q-1-3-4-3ZM14 40a4 4 0 1 0 8 0 4 4 0 1 0-8 0m28 0a4 4 0 1 0 8 0 4 4 0 1 0-8 0M25 36v7h14v-7Z"/><path d="M9 24H5q-5 0-5 4t7 5h5Zm46 0h4q5 0 5 4t-7 5h-5Z"/></svg><span>4,800m</span></button></div>
 </section>
 <section class="menu-section"><h2 class="menu-heading"><span class="menu-icon" aria-hidden="true">◷</span>요일과 시간</h2>
  <div id="dayGroups" class="day-tabs" role="tablist" aria-label="요일 구분"><button role="tab" aria-selected="true" aria-controls="periods" data-group="WD" class="active">평일</button><button role="tab" aria-selected="false" aria-controls="periods" data-group="WE">주말</button><button role="tab" aria-selected="false" aria-controls="periods" data-group="0609">연휴</button></div>
  <div class="periods" id="periods" role="group" aria-label="시간대"></div>
 </section>
 <section class="menu-section"><h2 class="menu-heading"><span class="menu-icon" aria-hidden="true">▦</span>지도 표현</h2>
  <div class="seg" id="views"><button class="active" data-view="square">사각 그리드</button><button data-view="hex">육각 그리드</button></div>
  <details class="display-settings"><summary>지도 세부 설정<span class="chevron" aria-hidden="true"></span></summary><div class="settings-body">
   <div class="controlrow"><label for="basemap">배경지도</label><select id="basemap"><option value="light">옅은 지도</option><option value="street">일반 지도</option><option value="none">없음</option></select></div>
   <div class="controlrow"><label for="baseOpacity">배경 농도</label><input id="baseOpacity" type="range" min="5" max="60" value="23"></div>
   <div class="controlrow"><label for="opacity">커뮤니티 농도</label><input id="opacity" type="range" min="10" max="95" value="78"></div>
   <div class="controlrow"><label for="mincells">최소 격자</label><select id="mincells"><option value="1">1</option><option value="10" selected>10</option><option value="30">30</option><option value="50">50</option></select></div>
  </div></details>
 </section>
 <section class="community-section"><h2 class="menu-heading"><span class="menu-icon" aria-hidden="true">⌕</span>커뮤니티</h2><div class="search"><input id="search" placeholder="동 이름 또는 커뮤니티 번호" aria-label="커뮤니티 검색"></div><div class="listhead"><span id="count"></span><span>격자 수</span></div><div id="list"></div></section>
 <div class="sidebar-footer"><button id="info"><span aria-hidden="true">ⓘ</span>자료 안내</button></div>
</aside>
<section class="detail glass" id="detail" hidden></section>
<div class="maptools glass"><button id="home" title="도심·영종 보기" aria-label="도심·영종 보기">⌂</button><button id="full" title="전체 범위" aria-label="전체 범위">⛶</button><span></span><button id="zoomIn" aria-label="확대">＋</button><button id="zoomOut" aria-label="축소">−</button></div>
<div id="loading"><span></span>공간 데이터 불러오는 중</div>
<dialog id="about" class="data-dialog"><button id="closeAbout" class="dialog-close" aria-label="닫기">×</button><h2>자료 안내</h2><dl class="data-totals"><div><dt>커뮤니티 수</dt><dd id="totalC">—</dd></div><div><dt>원본 격자 수</dt><dd id="totalG">—</dd></div><div><dt>표시 면적</dt><dd id="totalA">—</dd></div></dl></dialog>
<script src="vendor/leaflet.js"></script><script src="app.js?v=7"></script></body></html>
